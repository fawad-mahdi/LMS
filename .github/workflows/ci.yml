name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── Server: lint + integration tests (needs Postgres) ──────────────────────
  server:
    name: Server — lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches the values hardcoded in server/src/test/setup.js
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/lms_db
      JWT_SECRET: test_jwt_secret_32chars_minimum!!
      NODE_ENV: test

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate database
        run: npm run migrate

      - name: Seed database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

  # ── Client: lint + unit/component tests (no DB) ─────────────────────────────
  client:
    name: Client — lint & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        # --passWithNoTests: exits 0 when no test files exist yet;
        # remove this flag once frontend tests are added.
        run: npx vitest run --coverage --passWithNoTests
